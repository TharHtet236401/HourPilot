{% extends "app.html" %}

{% block title %}Shifts | HourPilot{% endblock %}

{% block app_content %}
<div class="px-4 py-6 sm:px-8 sm:py-10">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
        <div>
            <p class="text-xs font-medium uppercase tracking-[0.18em] text-teal-800">Shifts</p>
            <h1 class="mt-2 font-serif text-2xl tracking-tight text-stone-900 sm:text-3xl">Your shifts</h1>
            <p class="mt-2 hidden max-w-xl text-sm leading-6 text-stone-500 sm:block">
                Hours you have already logged, with duration and estimated pay.
            </p>
        </div>
        <div class="flex w-full flex-col gap-2 sm:w-auto sm:flex-row">
            <button
                type="button"
                hx-get="{% url 'shift_export' %}"
                hx-target="#modal"
                hx-swap="innerHTML"
                class="min-h-11 w-full touch-manipulation rounded-xl bg-stone-100 px-4 text-sm font-semibold text-stone-700 transition hover:bg-stone-200 sm:w-auto"
            >
                Export
            </button>
            {% if last_shift %}
                <button
                    type="button"
                    hx-get="{% url 'shift_create' %}?repeat=1"
                    hx-target="#modal"
                    hx-swap="innerHTML"
                    class="min-h-11 w-full touch-manipulation rounded-xl bg-stone-100 px-4 text-sm font-semibold text-stone-700 transition hover:bg-stone-200 sm:w-auto"
                >
                    Repeat last
                </button>
            {% endif %}
            <button
                type="button"
                hx-get="{% url 'shift_create' %}"
                hx-target="#modal"
                hx-swap="innerHTML"
                class="min-h-11 w-full touch-manipulation rounded-xl bg-teal-800 px-4 text-sm font-semibold text-white shadow-sm transition hover:bg-teal-700 sm:w-auto"
            >
                Add shift
            </button>
        </div>
    </div>

    <div id="shift-list" class="mt-5 sm:mt-8">
        {% include "shifts/partials/list.html" %}
    </div>
</div>
{% endblock %}
