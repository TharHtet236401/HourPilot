<div
    class="modal-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="shift-empty-title"
    onclick="if (event.target === this) closeModal()"
>
    <div class="modal-panel">
        <div class="flex items-start justify-between gap-3">
            <div>
                <p class="text-xs font-medium uppercase tracking-[0.18em] text-brand">Shift</p>
                <h2 id="shift-empty-title" class="mt-1 font-serif text-2xl tracking-tight text-stone-900">
                    Add a workplace first
                </h2>
            </div>
            <button
                type="button"
                onclick="closeModal()"
                class="rounded-lg p-1 text-stone-400 transition hover:bg-stone-100 hover:text-stone-700"
                aria-label="Close"
            >
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-5">
                    <path d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z" />
                </svg>
            </button>
        </div>
        <p class="mt-3 text-sm leading-6 text-stone-500">
            Shifts belong to a workplace, so create one before you log hours.
        </p>
        <div class="modal-actions">
            <button
                type="button"
                onclick="closeModal()"
                class="rounded-xl px-4 py-2.5 text-sm font-medium text-stone-600 transition hover:bg-stone-100"
            >
                Cancel
            </button>
            <button
                type="button"
                hx-get="{% url 'workplace_create' %}"
                hx-target="#modal"
                hx-swap="innerHTML"
                class="rounded-xl bg-brand px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-hover"
            >
                Add workplace
            </button>
        </div>
    </div>
</div>
