[project]
name = "hour-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1",
    "django-allauth>=65.19.1",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Django Meta.fields / widgets / labels are lists and dicts by design.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# Generated files; do not rewrite them to satisfy linters.
"**/migrations/*.py" = ["ALL"]
# Views catch Exception on purpose so a failed page still renders.
"**/views.py" = ["BLE001"]
"scripts/seed_demo.py" = ["BLE001"]
