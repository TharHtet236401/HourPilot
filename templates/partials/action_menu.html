<div class="relative" data-menu onclick="event.stopPropagation()">
    <button
        type="button"
        data-menu-toggle
        aria-expanded="false"
        aria-haspopup="menu"
        aria-label="{{ menu_label }}"
        class="inline-flex size-9 items-center justify-center rounded-xl text-stone-400 transition hover:bg-stone-100 hover:text-stone-700 sm:size-11"
    >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-5">
            <path d="M10 3a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM10 8.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM11.5 15.5a1.5 1.5 0 1 0-3 0 1.5 1.5 0 0 0 3 0Z" />
        </svg>
    </button>
    <div
        data-menu-panel
        role="menu"
        hidden
        class="absolute right-0 z-50 mt-1 w-40 overflow-hidden rounded-xl border border-stone-200 bg-white py-1 shadow-lg"
    >
        <button
            type="button"
            role="menuitem"
            hx-get="{{ edit_url }}"
            hx-target="#modal"
            hx-swap="innerHTML"
            class="flex min-h-11 w-full items-center px-3 text-left text-sm font-medium text-stone-700 transition hover:bg-stone-50"
        >
            Edit
        </button>
        <button
            type="button"
            role="menuitem"
            hx-get="{{ delete_url }}"
            hx-target="#modal"
            hx-swap="innerHTML"
            class="flex min-h-11 w-full items-center px-3 text-left text-sm font-medium text-red-700 transition hover:bg-red-50"
        >
            Delete
        </button>
    </div>
</div>
