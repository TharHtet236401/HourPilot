<div
    data-toast
    class="flex items-start justify-between gap-3 rounded-xl border border-stone-200 bg-white px-4 py-3 text-sm text-stone-700 shadow-sm transition duration-300"
>
    <p>{{ message }}</p>
    <button
        type="button"
        data-toast-close
        class="rounded-md p-0.5 text-stone-400 transition hover:bg-stone-100 hover:text-stone-700"
        aria-label="Dismiss"
    >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-4">
            <path d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z" />
        </svg>
    </button>
</div>
