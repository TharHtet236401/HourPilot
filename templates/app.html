{% extends "base.html" %}

{% block header %}{% endblock %}

{% block content %}
<div class="flex min-h-screen flex-col md:flex-row">
    <aside class="flex w-full flex-col border-b border-stone-200 bg-white md:w-64 md:border-b-0 md:border-r">
        <div class="flex items-center justify-between gap-3 border-b border-stone-200 px-4 py-4 md:border-b-0">
            <a href="{% url 'home' %}" class="flex items-center gap-2.5 text-stone-900">
                <span class="flex size-8 items-center justify-center rounded-lg bg-teal-800 text-white shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-4">
                        <path fill-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25ZM12.75 6a.75.75 0 0 0-1.5 0v6c0 .192.078.384.22.53l3.5 3.25a.75.75 0 1 0 1.06-1.06l-3.28-3.045V6Z" clip-rule="evenodd" />
                    </svg>
                </span>
                <span class="font-serif text-lg tracking-tight">Shift Tracker   </span>
            </a>
            <a
                href="{% url 'account_logout' %}"
                class="rounded-lg px-2 py-1 text-xs font-medium text-stone-500 transition hover:bg-stone-100 hover:text-stone-900 md:hidden"
            >
                Log out
            </a>
        </div>

        <div class="flex flex-1 flex-col px-3 py-3 md:px-4 md:py-0 md:pb-4">
            <nav class="flex gap-1 md:mt-2 md:flex-col">
                <a
                    href="{% url 'workplace_list' %}"
                    class="flex items-center gap-2.5 rounded-xl px-3 py-2 text-sm font-medium transition {% if request.resolver_match.url_name == 'workplace_list' %}bg-teal-800 text-white shadow-sm{% else %}text-stone-600 hover:bg-stone-100 hover:text-stone-900{% endif %}"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-4">
                        <path fill-rule="evenodd" d="M4.25 2A2.25 2.25 0 0 0 2 4.25v11.5A2.25 2.25 0 0 0 4.25 18h11.5A2.25 2.25 0 0 0 18 15.75V4.25A2.25 2.25 0 0 0 15.75 2H4.25ZM3.5 4.25a.75.75 0 0 1 .75-.75h11.5a.75.75 0 0 1 .75.75v11.5a.75.75 0 0 1-.75.75H4.25a.75.75 0 0 1-.75-.75V4.25Z" clip-rule="evenodd" />
                        <path d="M6 7.25A.75.75 0 0 1 6.75 6.5h6.5a.75.75 0 0 1 0 1.5h-6.5A.75.75 0 0 1 6 7.25ZM6.75 10a.75.75 0 0 0 0 1.5h6.5a.75.75 0 0 0 0-1.5h-6.5Z" />
                    </svg>
                    Workspaces
                </a>
                <a
                    href="{% url 'shift_list' %}"
                    class="flex items-center gap-2.5 rounded-xl px-3 py-2 text-sm font-medium transition {% if request.resolver_match.url_name == 'shift_list' %}bg-teal-800 text-white shadow-sm{% else %}text-stone-600 hover:bg-stone-100 hover:text-stone-900{% endif %}"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-4">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm.75-13a.75.75 0 0 0-1.5 0v5c0 .192.078.384.22.53l3 2.75a.75.75 0 0 0 1.06-1.06l-2.78-2.547V5Z" clip-rule="evenodd" />
                    </svg>
                    Shifts
                </a>
            </nav>

            <div class="mt-auto hidden items-center justify-between gap-2 border-t border-stone-200 px-1 pt-4 md:flex">
                <span class="truncate text-xs text-stone-500">{{ user.email }}</span>
                <a
                    href="{% url 'account_logout' %}"
                    class="shrink-0 rounded-lg px-2 py-1 text-xs font-medium text-stone-500 transition hover:bg-stone-100 hover:text-stone-900"
                >
                    Log out
                </a>
            </div>
        </div>
    </aside>

    <div class="min-w-0 flex-1">
        {% block app_content %}{% endblock %}
    </div>
</div>
{% endblock %}
