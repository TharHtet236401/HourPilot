{% extends "app.html" %}

{% block title %}Workspaces | HourPilot{% endblock %}

{% block app_content %}
<div class="page-pad">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
        <div class="min-w-0">
            <p class="text-xs font-medium uppercase tracking-[0.18em] text-brand">Workspaces</p>
            <h1 class="mt-2 font-serif text-2xl tracking-tight text-stone-900 sm:text-3xl">Your workplaces</h1>
            <p class="mt-2 hidden max-w-xl text-sm leading-6 text-stone-500 sm:block">
                Places you currently track hours for, with the rate stored for each one.
            </p>
        </div>
        <button
            type="button"
            hx-get="{% url 'workplace_create' %}"
            hx-target="#modal"
            hx-swap="innerHTML"
            class="min-h-11 w-full touch-manipulation rounded-xl bg-brand px-4 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-hover sm:w-auto"
        >
            Add workplace
        </button>
    </div>

    <div id="workplace-list" class="mt-5 sm:mt-8">
        {% include "workspaces/partials/list.html" %}
    </div>
</div>
{% endblock %}
