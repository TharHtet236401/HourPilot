{% extends "app.html" %}

{% block title %}Workspaces | Shift Tracker{% endblock %}

{% block app_content %}
<div class="px-4 py-10 sm:px-8">
    <div class="flex flex-wrap items-start justify-between gap-4">
        <div>
            <p class="text-xs font-medium uppercase tracking-[0.18em] text-teal-800">Workspaces</p>
            <h1 class="mt-2 font-serif text-3xl tracking-tight text-stone-900">Your workplaces</h1>
            <p class="mt-2 max-w-xl text-sm leading-6 text-stone-500">
                Places you currently track hours for, with the rate stored for each one.
            </p>
        </div>
        <button
            type="button"
            hx-get="{% url 'workplace_create' %}"
            hx-target="#modal"
            hx-swap="innerHTML"
            class="rounded-xl bg-teal-800 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-teal-700"
        >
            Add workplace
        </button>
    </div>

    <div id="workplace-list" class="mt-8">
        {% include "workspaces/partials/list.html" %}
    </div>
</div>
{% endblock %}
