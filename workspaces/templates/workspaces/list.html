{% extends "app.html" %}

{% block title %}Workspaces | Shift Tracker{% endblock %}

{% block app_content %}
<div class="px-4 py-6 sm:px-8 sm:py-10">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
        <div>
            <p class="text-xs font-medium uppercase tracking-[0.18em] text-teal-800">Workspaces</p>
            <h1 class="mt-2 font-serif text-2xl tracking-tight text-stone-900 sm:text-3xl">Your workplaces</h1>
            <p class="mt-2 max-w-xl text-sm leading-6 text-stone-500">
                Places you currently track hours for, with the rate stored for each one.
            </p>
        </div>
        <button
            type="button"
            hx-get="{% url 'workplace_create' %}"
            hx-target="#modal"
            hx-swap="innerHTML"
            class="min-h-11 w-full touch-manipulation rounded-xl bg-teal-800 px-4 text-sm font-semibold text-white shadow-sm transition hover:bg-teal-700 sm:w-auto"
        >
            Add workplace
        </button>
    </div>

    <div id="workplace-list" class="mt-8">
        {% include "workspaces/partials/list.html" %}
    </div>
</div>
{% endblock %}
